<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>阅读 · 故事盒子</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <script src="js/config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="page-reader">
  <div id="stage" class="stage">
    <div id="book" class="book-view" hidden></div>
    <div id="status" class="status">
      <div class="spinner"></div>
      <div id="statusText">正在打开…</div>
      <div class="progress" hidden><div id="progressBar"></div></div>
    </div>
  </div>

  <div id="controls" class="controls" role="toolbar" aria-label="阅读控制">
    <div class="ctl-side">
      <button id="fsBtn" class="ctl" title="全屏" aria-label="全屏">
        <svg class="i-enter" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <svg class="i-exit" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
      </button>
      <button id="modeBtn" class="ctl ctl-text" title="切换单页 / 双页" aria-label="切换单页或双页">
        <svg class="i-single" viewBox="0 0 24 24"><rect x="7" y="4" width="10" height="16" rx="1.5"/></svg>
        <svg class="i-double" viewBox="0 0 24 24"><rect x="2.5" y="5" width="9" height="14" rx="1.5"/><rect x="12.5" y="5" width="9" height="14" rx="1.5"/></svg>
        <span id="modeText">单页</span>
      </button>
    </div>
    <div class="ctl-nav">
      <button id="firstBtn" class="ctl" disabled title="第一页" aria-label="第一页">
        <svg viewBox="0 0 24 24" class="fill"><rect x="4" y="5" width="2.6" height="14" rx="1"/><path d="M19 5.5v13L8.5 12z"/></svg>
      </button>
      <button id="prevBtn" class="ctl big" disabled title="上一页" aria-label="上一页">
        <svg viewBox="0 0 24 24" class="fill"><path d="M12 6v12L3.5 12zM21 6v12l-8.5-6z"/></svg>
      </button>
      <span id="pageInfo" class="page-info">– / –</span>
      <button id="nextBtn" class="ctl big" disabled title="下一页" aria-label="下一页">
        <svg viewBox="0 0 24 24" class="fill"><path d="M3 6v12l8.5-6zM12 6v12l8.5-6z"/></svg>
      </button>
      <button id="lastBtn" class="ctl" disabled title="最后一页" aria-label="最后一页">
        <svg viewBox="0 0 24 24" class="fill"><path d="M5 5.5v13L15.5 12z"/><rect x="17.4" y="5" width="2.6" height="14" rx="1"/></svg>
      </button>
    </div>
    <div class="ctl-side right">
      <button id="exitBtn" class="ctl ctl-text" title="退出阅读" aria-label="退出阅读">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        <span>退出</span>
      </button>
    </div>
  </div>
  <script type="module" src="js/reader.js"></script>
</body>
</html>
